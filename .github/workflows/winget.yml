name: Publish to WinGet
on:
  release:
    types: [released]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish LocalChat
        uses: vedantmgoyal9/winget-releaser@main
        with:
          identifier: LocalChat.LocalChat
          installers-regex: 'LocalChat-(?!CLI-).*\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
      - name: Publish LocalChat CLI
        uses: vedantmgoyal9/winget-releaser@main
        with:
          identifier: LocalChat.LocalChat.CLI
          installers-regex: 'LocalChat-CLI-.*\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
